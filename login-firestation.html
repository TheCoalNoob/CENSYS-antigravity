<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CENSYS — Fire Station Login</title>
  <meta name="description" content="Login portal for San Nicolas Fire Substation personnel.">
  <link rel="stylesheet" href="styles.css">
  <style>
    body { overflow: auto; }
    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .login-box {
      width: min(440px, 100%);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      padding: 48px 36px;
    }
    .login-box__icon {
      width: 56px;
      height: 56px;
      background: #fef2f2;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      margin-bottom: 20px;
    }
    .login-box__title {
      font-size: 24px;
      font-weight: 700;
    }
    .login-box__sub {
      color: var(--text-secondary);
      font-size: 14px;
      margin-top: 4px;
      margin-bottom: 28px;
    }
    .login-box__back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 20px;
      transition: color var(--transition);
    }
    .login-box__back:hover {
      color: var(--brand);
    }
  </style>
</head>
<body>
  <main class="login-page">
    <div class="login-box">
      <div class="login-box__icon" style="font-size:16px;font-weight:900;color:#dc2626">FS</div>
      <h1 class="login-box__title">Fire Station Login</h1>
      <p class="login-box__sub">CENSYS Fire Monitoring Network — authorized fire station personnel only.</p>

      <form id="loginForm" onsubmit="return handleLogin(event)">
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <input class="form-input" type="text" id="username" placeholder="Enter username" autocomplete="username" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input class="form-input" type="password" id="password" placeholder="Enter password" autocomplete="current-password" required>
        </div>
        <div class="form-error" id="loginError">Invalid username or password. Please try again.</div>
        <button type="submit" class="btn btn--primary btn--block btn--lg" id="loginBtn">Sign In</button>
      </form>

      <a href="index.html" class="login-box__back">← Back to role selection</a>
    </div>
  </main>

  <script>
    function handleLogin(e) {
      e.preventDefault();
      const user = document.getElementById('username').value.trim().toLowerCase();
      const pass = document.getElementById('password').value;
      const errEl = document.getElementById('loginError');

      if (user === 'sannicolas' && pass === 'sannicolas') {
        sessionStorage.setItem('role', 'firestation');
        sessionStorage.setItem('user', 'sannicolas');
        window.location.href = 'dashboard-firestation.html';
      } else {
        errEl.classList.add('visible');
        document.getElementById('password').value = '';
        document.getElementById('password').focus();
      }
      return false;
    }
  </script>
</body>
</html>
